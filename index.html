<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نزار محمد حسن | البطاقة التعريفية</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px 40px;
            border-radius: 12px;
            border-top: 4px solid #38bdf8;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        p {
            font-size: 18px;
            margin: 12px 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        span {
            color: #94a3b8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>البطاقة التعريفية</h1>
        <p><span>الاسم:</span> نزار محمد حسن</p>
        <p><span>العمر:</span> 20 سنة</p>
        <p><span>التخصص:</span> أمن سيبراني</p>
        <p><span>السنة الدراسية:</span> السنة الثانية</p>
    </div>

</body>
</html>
